<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Upper Labay High School</title>
    <link rel="icon" type="image/webp" href="../assets/images/school-logo.webp">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/typography.css">
    <style>
        body {
            margin: 0;
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: #111827;
        }
        .page-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
            padding: 2.5rem;
            max-width: 640px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            margin: 0 0 0.75rem;
        }
        p {
            line-height: 1.7;
            color: #4b5563;
            margin: 0 0 1rem;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 1.2rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            border-radius: 999px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="card">
            <div class="badge">Coming Soon</div>
            <h1>This feature is on the way.</h1>
            <p>This website feature will be available soon. Please check back again later for updates.</p>
            <a class="btn" href="../index.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
