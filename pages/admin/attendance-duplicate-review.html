<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Attendance Review | Upper Labay High School</title>
    <link rel="stylesheet" href="../../assets/vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/sardo-pages.css">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/admin-nav.js"></script>
</head>
<body class="sardo-page bg-gray-100 min-h-screen font-sans">
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6"><div><p class="text-xs font-black uppercase tracking-widest text-blue-700">Data Quality</p><h1 class="text-2xl font-black text-gray-900">Duplicate Attendance Review</h1><p class="text-sm text-gray-600 mt-1">Historical duplicates are preserved and marked for review.</p></div><a href="sardo-dashboard.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-black uppercase">Back to SARDO</a></div>
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm"><div class="sardo-table-wrap"><table class="min-w-full text-sm"><caption class="sr-only">Duplicate attendance records</caption><thead class="bg-gray-50 text-left text-xs uppercase tracking-wider"><tr><th scope="col" class="p-3">LRN</th><th scope="col" class="p-3">Date</th><th scope="col" class="p-3">Session</th><th scope="col" class="p-3">Duplicate</th><th scope="col" class="p-3">Canonical</th><th scope="col" class="p-3">Scanned</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="p-8 text-center text-gray-500">Loading...</td></tr></tbody></table></div></div>
    </main>
    <script>
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]); }
        async function init() {
            const rows = document.getElementById('rows');
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            const { data: profile } = await window.supabaseClient.from('profiles').select('role').eq('id', session?.user?.id).single();
            if (!profile || !['admin', 'school_head'].includes(String(profile.role).toLowerCase())) { alert('Administrator or School Head permission is required.'); location.href = './admin-dashboard.html'; return; }
            // Query attendance_logs directly for duplicate records (view was dropped for security)
            const { data: duplicates, error: dupError } = await window.supabaseClient
                .from('attendance_logs')
                .select(`
                    id,
                    student_lrn,
                    session,
                    local_date,
                    status,
                    scanned_at,
                    scanned_at_local,
                    duplicate_of_id
                `)
                .not('duplicate_of_id', 'is', null)
                .order('local_date', { ascending: false, nullsFirst: false })
                .order('scanned_at', { ascending: false });
            
            if (dupError) {
                rows.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-600">${escapeHtml(dupError.message)}</td></tr>`;
                return;
            }
            
            // Get canonical records for each duplicate
            const data = [];
            for (const dup of duplicates || []) {
                const { data: canonical, error: canonError } = await window.supabaseClient
                    .from('attendance_logs')
                    .select('id, status, scanned_at, scanned_at_local')
                    .eq('id', dup.duplicate_of_id)
                    .single();
                
                if (!canonError && canonical) {
                    data.push({
                        ...dup,
                        attendance_date: dup.local_date || String(dup.scanned_at_local || '').slice(0, 10),
                        canonical_status: canonical.status,
                        canonical_scanned_at: canonical.scanned_at,
                        canonical_scanned_at_local: canonical.scanned_at_local
                    });
                }
            }
            rows.innerHTML = data?.length ? data.map(row => `<tr class="border-t"><td class="p-3 font-mono">${escapeHtml(row.student_lrn)}</td><td class="p-3">${escapeHtml(row.attendance_date)}</td><td class="p-3">${escapeHtml(row.session)}</td><td class="p-3">#${escapeHtml(row.id)} · ${escapeHtml(row.status)}</td><td class="p-3">#${escapeHtml(row.duplicate_of_id)} · ${escapeHtml(row.canonical_status)}</td><td class="p-3">${escapeHtml(row.scanned_at_local || row.scanned_at)}</td></tr>`).join('') : '<tr><td colspan="6" class="p-8 text-center text-green-600">No marked duplicates.</td></tr>';
        }
        window.addEventListener('load', () => window.supabaseClient ? init() : setTimeout(init, 100));
    </script>
</body>
</html>
