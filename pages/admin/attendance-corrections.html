<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Corrections | Upper Labay High School</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link rel="stylesheet" href="../../assets/vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/sardo-pages.css">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/admin-nav.js"></script>
</head>
<body class="sardo-page bg-gray-100 min-h-screen font-sans">
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
                <p class="text-xs font-black uppercase tracking-widest text-blue-700">Attendance Administration</p>
                <h1 class="text-2xl font-black text-gray-900">Correction Requests</h1>
                <p class="text-sm text-gray-600 mt-1">Review and approve changes to attendance records.</p>
            </div>
            <a href="sardo-dashboard.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-black uppercase tracking-wider">Back to SARDO</a>
        </div>
        <div id="page-status" role="status" aria-live="polite" class="hidden mb-4 rounded-lg p-3 text-sm font-semibold"></div>
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="font-black text-gray-800 uppercase tracking-wider text-sm">Pending Requests</h2>
                <button id="refresh-btn" type="button" class="px-3 py-2 border border-gray-300 rounded-lg text-xs font-black uppercase"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
            </div>
            <div id="requests" class="divide-y divide-gray-100">
                <p class="p-8 text-center text-gray-500">Loading correction requests...</p>
            </div>
        </div>
    </main>
    <script>
        let profile = null;

        function showStatus(message, isError = false) {
            const element = document.getElementById('page-status');
            element.textContent = message;
            element.className = `mb-4 rounded-lg p-3 text-sm font-semibold ${isError ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
        }

        async function verifyAccess() {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) return;
            const { data, error } = await window.supabaseClient.from('profiles').select('id, role, full_name').eq('id', session.user.id).single();
            if (error || !data || !['admin', 'school_head'].includes(String(data.role).toLowerCase())) {
                alert('ACCESS DENIED: Administrator or School Head permission is required.');
                window.location.href = './admin-dashboard.html';
                return;
            }
            profile = data;
            loadRequests();
        }

        function renderRequests(rows) {
            const container = document.getElementById('requests');
            if (!rows.length) {
                container.innerHTML = '<p class="p-8 text-center text-gray-500">No pending correction requests.</p>';
                return;
            }
            container.innerHTML = rows.map(row => `
                <article class="p-5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div>
                        <p class="font-black text-gray-900">LRN ${escapeHtml(row.student_lrn)}</p>
                        <p class="text-sm text-gray-700 mt-1">${escapeHtml(row.reason)}</p>
                        <p class="text-xs text-gray-500 mt-2">Requested ${new Date(row.requested_at).toLocaleString()} · ${escapeHtml(row.requested_by)}</p>
                        ${row.attendance_log_id ? `<p class="text-xs text-gray-500">Attendance log: ${escapeHtml(row.attendance_log_id)}</p>` : '<p class="text-xs text-orange-600">No attendance log selected; add the correction details before approval.</p>'}
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" class="approve-btn px-3 py-2 bg-green-600 text-white rounded-lg text-xs font-black uppercase" data-id="${row.id}" data-log-id="${row.attendance_log_id || ''}"><i class="fa-solid fa-check mr-1"></i>Approve</button>
                        <button type="button" class="reject-btn px-3 py-2 bg-red-600 text-white rounded-lg text-xs font-black uppercase" data-id="${row.id}"><i class="fa-solid fa-xmark mr-1"></i>Reject</button>
                    </div>
                </article>
            `).join('');
        }

        async function loadRequests() {
            const { data, error } = await window.supabaseClient.from('attendance_corrections').select('*').eq('status', 'pending').order('requested_at', { ascending: true });
            if (error) {
                showStatus(error.message, true);
                return;
            }
            renderRequests(data || []);
        }

        async function decideRequest(id, status, logId) {
            const notes = window.prompt(`${status === 'approved' ? 'Approval' : 'Rejection'} notes:`);
            if (notes === null) return;
            if (status === 'approved' && !logId) {
                showStatus('This request has no attendance log. It cannot be approved until the request contains a target log.', true);
                return;
            }
            const { error } = status === 'approved'
                ? await window.supabaseClient.rpc('approve_attendance_correction', { correction_id: id, decision_notes: notes })
                : await window.supabaseClient.rpc('reject_attendance_correction', { correction_id: id, decision_notes: notes });
            if (error) throw error;
            if (typeof window.logAdminAction === 'function') window.logAdminAction(`attendance_correction_${status}`, null, { correction_id: id, attendance_log_id: logId });
            await loadRequests();
        }

        document.getElementById('requests').addEventListener('click', async event => {
            const approve = event.target.closest('.approve-btn');
            const reject = event.target.closest('.reject-btn');
            if (!approve && !reject) return;
            try {
                await decideRequest((approve || reject).dataset.id, approve ? 'approved' : 'rejected', (approve || reject).dataset.logId);
            } catch (error) {
                showStatus(error.message, true);
            }
        });
        document.getElementById('refresh-btn').addEventListener('click', loadRequests);
        window.addEventListener('load', () => {
            if (window.supabaseClient) verifyAccess();
            else setTimeout(() => verifyAccess(), 100);
        });
    </script>
</body>
</html>
