<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARDO Pilot Review | Upper Labay High School</title>
    <link rel="stylesheet" href="../../assets/vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/sardo-pages.css">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/admin-nav.js"></script>
</head>
<body class="sardo-page bg-gray-100 min-h-screen font-sans">
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-wrap justify-between gap-4 mb-6"><div><p class="text-xs font-black uppercase tracking-widest text-blue-700">SARDO Pilot</p><h1 class="text-2xl font-black text-gray-900">Guidance review</h1><p class="text-sm text-gray-600 mt-1">Record whether each automated classification matches the verified attendance case.</p></div><a href="sardo-dashboard.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-black uppercase">Back to SARDO</a></div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6"><div class="bg-white p-4 rounded-xl border"><p class="text-xs uppercase font-black text-gray-500">Cases</p><p id="cases" class="text-2xl font-black">0</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-xs uppercase font-black text-gray-500">Match rate</p><p id="match" class="text-2xl font-black">0%</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-xs uppercase font-black text-gray-500">Interventions</p><p id="interventions" class="text-2xl font-black">0</p></div><div class="bg-white p-4 rounded-xl border"><p class="text-xs uppercase font-black text-gray-500">Effective</p><p id="effective" class="text-2xl font-black">0</p></div></div>
        <div class="bg-white rounded-xl border shadow-sm"><div class="sardo-table-wrap"><table class="min-w-full text-sm"><caption class="sr-only">SARDO pilot review cases</caption><thead class="bg-gray-50 text-left text-xs uppercase"><tr><th scope="col" class="p-3">Student LRN</th><th scope="col" class="p-3">Assessed</th><th scope="col" class="p-3">Actual</th><th scope="col" class="p-3">Intervention</th><th scope="col" class="p-3">Outcome</th><th scope="col" class="p-3">Action</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="p-8 text-center text-gray-500">Loading pilot cases...</td></tr></tbody></table></div></div>
    </main>
    <script>
        let session;
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]); }
        async function init() {
            const auth = await window.supabaseClient.auth.getSession(); session = auth.data.session;
            const { data: profile } = await window.supabaseClient.from('profiles').select('role').eq('id', session?.user?.id).single();
            if (!profile || !['admin', 'school_head', 'guidance_counselor'].includes(String(profile.role).toLowerCase())) { alert('SARDO permission is required.'); location.href = './admin-dashboard.html'; return; }
            const { data, error } = await window.supabaseClient.from('sardo_pilot_reviews').select('*').order('reviewed_at', { ascending: false });
            if (error) { document.getElementById('rows').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-600">${escapeHtml(error.message)}</td></tr>`; return; }
            const rows = data || []; const matches = rows.filter(row => row.classification_match).length;
            document.getElementById('cases').textContent = rows.length; document.getElementById('match').textContent = `${rows.length ? Math.round(matches / rows.length * 100) : 0}%`; document.getElementById('interventions').textContent = rows.filter(row => row.intervention_provided).length; document.getElementById('effective').textContent = rows.filter(row => row.intervention_effective).length;
            document.getElementById('rows').innerHTML = rows.length ? rows.map(row => `<tr class="border-t"><td class="p-3 font-mono">${escapeHtml(row.student_lrn)}</td><td class="p-3">${escapeHtml(row.assessed_risk_level)}</td><td class="p-3">${escapeHtml(row.actual_risk_level)}</td><td class="p-3">${row.intervention_provided ? 'Yes' : 'No'}</td><td class="p-3">${row.intervention_effective === true ? 'Effective' : row.intervention_effective === false ? 'Not effective' : 'Pending'}</td><td class="p-3"><button class="review-btn px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-black uppercase" data-id="${row.id}">Review</button></td></tr>`).join('') : '<tr><td colspan="6" class="p-8 text-center text-gray-500">No pilot reviews recorded.</td></tr>';
        }
        document.getElementById('rows').addEventListener('click', async event => { const button = event.target.closest('.review-btn'); if (!button) return; const actual = prompt('Actual risk level (Critical, High, Medium, Low):'); if (!['Critical', 'High', 'Medium', 'Low'].includes(actual)) return; const intervention = confirm('Was an intervention provided?'); const effective = intervention ? confirm('Was the intervention effective?') : null; const outcome = prompt('Outcome or notes:') || null; const { error } = await window.supabaseClient.from('sardo_pilot_reviews').update({ actual_risk_level: actual, intervention_provided: intervention, intervention_effective: effective, outcome }).eq('id', button.dataset.id); if (error) alert(error.message); else init(); });
        window.addEventListener('load', () => window.supabaseClient ? init() : setTimeout(init, 100));
    </script>
</body>
</html>
