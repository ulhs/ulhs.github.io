<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.net wss://*.supabase.co wss://*.supabase.net;">
    <title>Grades | Parent Portal</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Acme&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../../assets/js/secure-session.js"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/theme-manager.js"></script>
    <script src="../../assets/js/parent-nav.js"></script>
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/style.css?v=20260905-parent-theme">
    <link rel="stylesheet" href="../../assets/css/parent-portal.css?v=20260905-parent-theme">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <style>
        .student-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .student-card.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .term-btn {
            transition: all 0.2s ease;
        }
        .term-btn.active {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
        }
        .grade-card {
            transition: all 0.2s ease;
        }
        .grade-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="parent-language-control">
        <label for="parent-language" data-i18n="languageLabel">Language</label>
        <select id="parent-language" data-parent-language>
            <option value="en" data-i18n="simpleEnglish">Simple English</option>
            <option value="ceb-en" data-i18n="cebuanoBisaya">Cebuano / Bisaya</option>
            <option value="fil" data-i18n="filipino">Filipino</option>
        </select>
    </div>
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <h1 class="text-lg font-black text-gray-900 uppercase tracking-tight" style="font-family: 'Acme', sans-serif;">Grades</h1>
                <div class="hidden">
                    <button onclick="handleParentLogout(event)" class="flex shrink-0 items-center gap-2 px-3 py-2.5 sm:px-5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-all text-[10px] sm:text-xs font-black uppercase tracking-widest border border-red-100 shadow-sm whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <button onclick="window.location.href='dashboard.html'" class="inline-flex items-center gap-2 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-emerald-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Parent Portal
            </button>
            <button onclick="handleParentLogout(event)" class="inline-flex items-center gap-2 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-red-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 013 3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
        <!-- Parent Welcome -->
        <div id="parent-welcome" class="mb-6"></div>

        <!-- Student Selector -->
        <div class="mb-6">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Select Student</h2>
            <div id="student-selector" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
                <!-- Student cards will be inserted here -->
            </div>
        </div>

        <!-- Term Selector -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-md mb-6">
            <h3 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-3">Select Term</h3>
            <div class="flex flex-wrap gap-3">
                <button data-term="1" class="term-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest active shadow-md">Term 1</button>
                <button data-term="2" class="term-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-white text-gray-700 border border-gray-200 shadow-sm hover:bg-gray-50">Term 2</button>
                <button data-term="3" class="term-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-white text-gray-700 border border-gray-200 shadow-sm hover:bg-gray-50">Term 3</button>
            </div>
        </div>

        <!-- Grades Container -->
        <div id="grades-container" class="space-y-5">
            <!-- Grades will be rendered here -->
        </div>

        <!-- Privacy Policy Link -->
        <div class="mt-6 text-center">
            <a href="../privacy-policy.html" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
                Privacy Policy
            </a>
        </div>
    </main>

    <script>
        let students = [];
        let activeStudent = null;
        let currentTerm = 1;

        async function loadStudentPhotoSecurely(lrn, photoUrl, imgElement, placeholderSvg) {
            if (!imgElement) return;

            const parentSessionToken = secureSession.getItem('parentSessionToken');
            if (!parentSessionToken) {
                imgElement.style.display = 'none';
                return;
            }

            try {
                // Request a signed URL from our edge function
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-photo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({ parentSessionToken, studentLrn: lrn })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to get photo');
                }

                // Use the signed URL
                imgElement.src = result.signedUrl;
                imgElement.style.display = 'block';
            } catch (err) {
                console.error('Error loading photo:', err);
                imgElement.style.display = 'none';
            }
        }

        async function initPage() {
            if (!window.supabaseClient) {
                setTimeout(initPage, 100);
                return;
            }

            students = secureSession.getItem('parentStudents') || [];
            const activeLrn = secureSession.getItem('activeStudentLrn');
            const parentName = secureSession.getItem('parentName');
            
            if (students.length === 0) {
                window.location.href = 'login.html';
                return;
            }

            activeStudent = students.find(s => String(s.lrn) === String(activeLrn)) || students[0];
            
            renderParentWelcome(parentName);
            renderStudentSelector();
            await fetchGrades();

            document.querySelectorAll('.term-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.term-btn').forEach(b => {
                        b.classList.remove('active');
                        b.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-200', 'shadow-sm');
                    });
                    e.target.classList.add('active');
                    currentTerm = parseInt(e.target.dataset.term);
                    fetchGrades();
                });
            });
        }

        function renderParentWelcome(parentName) {
            const container = document.getElementById('parent-welcome');
            
            container.innerHTML = `
                <div class="welcome-banner rounded-2xl p-5 text-white shadow-md">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-1">Welcome to Parent Portal</p>
                            <h2 class="text-xl font-black mb-1">Hello, ${parentName || 'Parent'}!</h2>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentSelector() {
            const container = document.getElementById('student-selector');
            
            container.innerHTML = students.map(student => {
                const isActive = String(student.lrn) === String(activeStudent.lrn);
                
                return `
                    <div class="student-card bg-white rounded-2xl p-5 border-2 ${isActive ? 'border-blue-500 active' : 'border-gray-100'} cursor-pointer shadow-sm"
                         data-lrn="${student.lrn}"
                         data-student-name="${student.full_name}">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center overflow-hidden shadow-sm">
                                <img class="student-photo w-full h-full object-cover object-top" data-lrn="${student.lrn}" data-photo-url="${student.photo_url || ''}" style="display:none" alt="${student.full_name}">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-black text-gray-900 truncate">${student.full_name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${student.section || 'N/A'}</span>
                                    <span class="text-[10px] font-bold text-gray-400">Grade ${student.grade_level || 'N/A'}</span>
                                </div>
                            </div>
                            ${isActive ? 
                                `<div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center shadow-sm">
                                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            const cards = container.querySelectorAll('.student-card');
            cards.forEach(async (card) => {
                const imgElement = card.querySelector('.student-photo');
                const lrn = imgElement.dataset.lrn;
                const photoUrl = imgElement.dataset.photoUrl || `profiles/${lrn}.webp`;
                await loadStudentPhotoSecurely(lrn, photoUrl, imgElement);
                
                card.addEventListener('click', () => {
                    const lrn = card.getAttribute('data-lrn');
                    if (lrn) selectStudent(lrn);
                });
            });
        }

        function selectStudent(lrn) {
            activeStudent = students.find(s => String(s.lrn) === String(lrn));
            secureSession.setItem('activeStudentLrn', lrn);
            renderStudentSelector();
            fetchGrades();
        }

        async function fetchGrades() {
            const container = document.getElementById('grades-container');
            const parentSessionToken = secureSession.getItem('parentSessionToken');
            
            try {
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({
                        parentSessionToken,
                        studentLrn: activeStudent.lrn,
                        type: 'grades',
                        term: currentTerm
                    })
                });

                const result = await response.json();

                if (response.status === 403 && result.code === 'GRADES_TEMPORARILY_UNAVAILABLE') {
                    renderGradesUnavailable(result.error);
                    return;
                }

                if (!response.ok) {
                    throw new Error(result.error);
                }

                if (!result.grades || result.grades.length === 0) {
                    renderSampleGrades();
                } else {
                    renderGrades(result.grades);
                }
            } catch (err) {
                console.error('Error fetching grades:', err);
                renderGradesUnavailable('Grades could not be loaded right now. Please try again later or contact the school.');
            }
        }

        function renderGradesUnavailable(message) {
            const container = document.getElementById('grades-container');

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-amber-200 shadow-md">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-10 h-10 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86l-7.82 13a2 2 0 001.71 3h15.64a2 2 0 001.71-3l-7.82-13a2 2 0 00-3.42 0z"></path>
                            </svg>
                        </div>
                        <h3 class="text-xs font-bold text-amber-700 uppercase tracking-widest mb-2">Grades Temporarily Hidden</h3>
                        <p class="text-[10px] text-gray-600 font-semibold">${message || 'Please contact the school for more information.'}</p>
                    </div>
                </div>
            `;
        }

        function getGradeColor(grade) {
            if (grade >= 90) return 'from-green-100 to-emerald-100 text-green-800 border-green-200';
            if (grade >= 85) return 'from-blue-100 to-indigo-100 text-blue-800 border-blue-200';
            if (grade >= 80) return 'from-yellow-100 to-amber-100 text-yellow-800 border-yellow-200';
            if (grade >= 75) return 'from-orange-100 to-red-100 text-orange-800 border-orange-200';
            return 'from-red-100 to-pink-100 text-red-800 border-red-200';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[character]));
        }

        function renderGrades(grades) {
            const container = document.getElementById('grades-container');
            
            container.innerHTML = `
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-md">
                    <h3 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-5">Term ${currentTerm} Grades</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${grades.map(grade => `
                            <div class="grade-card bg-gradient-to-br ${getGradeColor(grade.grade)} rounded-xl p-5 border-2">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h4 class="text-sm font-black text-gray-900 mb-1">${escapeHtml(grade.subject)}</h4>
                                        <p class="text-[10px] text-gray-600 font-semibold">${escapeHtml(grade.teacher || 'Teacher')}</p>
                                    </div>
                                    <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md">
                                        <span class="text-2xl font-black text-gray-800">${grade.grade}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSampleGrades() {
            const container = document.getElementById('grades-container');
            
            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-gray-100 shadow-md">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-gradient-to-br from-purple-100 to-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-md">
                            <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">No Grades Yet</h3>
                        <p class="text-[10px] text-gray-600 font-semibold">Grades for Term ${currentTerm} will appear here when available</p>
                    </div>
                </div>
            `;
        }

        initPage();
    </script>
    <script src="../../assets/js/parent-language.js"></script>
</body>
</html>
