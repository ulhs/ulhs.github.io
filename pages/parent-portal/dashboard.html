<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.net wss://*.supabase.co wss://*.supabase.net;">
    <title>Parent Portal | Upper Labay High School</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Acme&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../../assets/js/secure-session.js"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/theme-manager.js"></script>
    <script src="../../assets/js/parent-nav.js"></script>
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/style.css?v=20260905-parent-theme">
    <link rel="stylesheet" href="../../assets/css/parent-portal.css?v=20260905-parent-theme">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <style>
        .student-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .student-card.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="parent-language-control">
        <label for="parent-language" data-i18n="languageLabel">Language</label>
        <select id="parent-language" data-parent-language>
            <option value="en" data-i18n="simpleEnglish">Simple English</option>
            <option value="ceb-en" data-i18n="cebuanoBisaya">Cebuano / Bisaya</option>
            <option value="fil" data-i18n="filipino">Filipino</option>
        </select>
    </div>
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <img src="../../assets/images/school-logo.webp" alt="ULHS" class="w-10 h-10">
                    <div>
                        <h1 class="text-lg font-black text-gray-900 uppercase tracking-tight" style="font-family: 'Acme', sans-serif;">Parent Portal</h1>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Upper Labay High School</p>
                    </div>
                </div>
                <button onclick="handleParentLogout(event)" class="hidden">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6 flex justify-end">
            <button onclick="handleParentLogout(event)" class="inline-flex shrink-0 items-center gap-2 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-red-700 shadow-md hover:shadow-lg whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 013 3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
        <!-- Parent Welcome -->
        <div id="parent-welcome" class="mb-8"></div>

        <!-- Student Selector -->
        <div class="mb-8">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Select a student below to view their school information</h2>
            <div id="student-selector" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
                <!-- Student cards will be inserted here -->
            </div>
        </div>

        <!-- Welcome & Quick Stats (only when student selected) -->
        <div id="dashboard-content" class="space-y-6 hidden">
            <!-- Content will be dynamically loaded based on selected student -->
        </div>
    </main>

    <script>
        let students = [];
        let activeStudent = null;

        async function loadStudentPhotoSecurely(lrn, photoUrl, imgElement, placeholderSvg) {
            if (!imgElement) return;

            const parentSessionToken = secureSession.getItem('parentSessionToken');
            if (!parentSessionToken) {
                imgElement.style.display = 'none';
                return;
            }

            try {
                // Request a signed URL from our edge function
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-photo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({ parentSessionToken, studentLrn: lrn })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to get photo');
                }

                // Use the signed URL
                imgElement.src = result.signedUrl;
                imgElement.style.display = 'block';
            } catch (err) {
                console.error('Error loading photo:', err);
                imgElement.style.display = 'none';
            }
        }

        // Initialize dashboard
        async function initDashboard() {
            if (!window.supabaseClient) {
                setTimeout(initDashboard, 100);
                return;
            }

            students = secureSession.getItem('parentStudents') || [];
            const activeLrn = secureSession.getItem('activeStudentLrn');
            const parentName = secureSession.getItem('parentName');
            
            console.log('=== INIT DASHBOARD ===');
            console.log('All students:', students);
            console.log('Active LRN from storage:', activeLrn);
            console.log('Parent name from storage:', parentName);
            
            if (students.length === 0) {
                window.location.replace('./login.html');
                return;
            }

            // Render parent welcome first
            renderParentWelcome(parentName);
            
            // Check if there's an active student
            if (activeLrn) {
                activeStudent = students.find(s => String(s.lrn) === String(activeLrn));
            }
            
            renderStudentSelector();
            
            if (activeStudent) {
                renderDashboardContent();
            }
        }

        // Render parent welcome
        function renderParentWelcome(parentName) {
            const container = document.getElementById('parent-welcome');
            
            container.innerHTML = `
                <div class="welcome-banner rounded-3xl p-7 text-white shadow-xl">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-xs font-bold text-blue-100 uppercase tracking-widest mb-2">Welcome to Parent Portal</p>
                            <h2 class="text-2xl font-black">Hello, ${parentName || 'Parent'}!</h2>
                        </div>
                        <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render student selector
        function renderStudentSelector() {
            console.log('=== RENDERING STUDENT SELECTOR ===');
            console.log('Active student LRN:', activeStudent.lrn);
            
            const container = document.getElementById('student-selector');
            
            container.innerHTML = students.map(student => {
                const isActive = String(student.lrn) === String(activeStudent.lrn);
                console.log(`Student: ${student.full_name}, LRN: ${student.lrn}, IsActive: ${isActive}`);
                
                return `
                    <div class="student-card bg-white rounded-2xl p-5 border-2 ${isActive ? 'border-blue-500 active' : 'border-gray-100'} cursor-pointer shadow-sm"
                         data-lrn="${student.lrn}"
                         data-student-name="${student.full_name}">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden">
                                <img class="student-photo w-full h-full object-cover object-top" data-lrn="${student.lrn}" data-photo-url="${student.photo_url || ''}" style="display:none" alt="${student.full_name}">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-black text-gray-900 truncate">${student.full_name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${student.section || 'N/A'}</span>
                                    <span class="text-[10px] font-bold text-gray-400">Grade ${student.grade_level || 'N/A'}</span>
                                </div>
                            </div>
                            ${isActive ? 
                                `<div class="w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center">
                                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Load photos and add click listeners
            const cards = container.querySelectorAll('.student-card');
            console.log(`Found ${cards.length} student cards`);
            
            cards.forEach(async (card) => {
                const imgElement = card.querySelector('.student-photo');
                const lrn = imgElement.dataset.lrn;
                const photoUrl = imgElement.dataset.photoUrl || `profiles/${lrn}.webp`;
                await loadStudentPhotoSecurely(lrn, photoUrl, imgElement);
                
                card.addEventListener('click', (e) => {
                    console.log('Card clicked!', e.target);
                    const lrn = card.getAttribute('data-lrn');
                    console.log('LRN from card:', lrn);
                    if (lrn) selectStudent(lrn);
                });
            });
        }

        // Select student
        function selectStudent(lrn) {
            console.log('Selecting student with LRN:', lrn);
            activeStudent = students.find(s => String(s.lrn) === String(lrn));
            console.log('Active student set to:', activeStudent);
            secureSession.setItem('activeStudentLrn', lrn);
            renderStudentSelector();
            renderDashboardContent();
        }

        // Render dashboard content
        async function renderDashboardContent() {
            const container = document.getElementById('dashboard-content');
            
            if (!activeStudent) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            
            container.innerHTML = `
                <!-- Quick Actions Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                    <!-- Attendance -->
                    <div class="nav-item bg-white rounded-2xl p-6 border border-gray-100 shadow-md cursor-pointer" onclick="window.location.href='attendance-history.html'">
                        <div class="flex flex-col items-center text-center">
                            <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <h3 class="text-base font-black text-gray-900 mb-1">Attendance</h3>
                            <p class="text-xs text-gray-500 font-semibold">View history</p>
                        </div>
                    </div>

                    <!-- Grades -->
                    <div class="nav-item bg-white rounded-2xl p-6 border border-gray-100 shadow-md cursor-pointer" onclick="window.location.href='grades.html'">
                        <div class="flex flex-col items-center text-center">
                            <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-violet-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                                </svg>
                            </div>
                            <h3 class="text-base font-black text-gray-900 mb-1">Grades</h3>
                            <p class="text-xs text-gray-500 font-semibold">View term grades</p>
                        </div>
                    </div>

                    <!-- Achievements -->
                    <div class="nav-item bg-white rounded-2xl p-6 border border-gray-100 shadow-md cursor-pointer" onclick="window.location.href='achievements.html'">
                        <div class="flex flex-col items-center text-center">
                            <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                </svg>
                            </div>
                            <h3 class="text-base font-black text-gray-900 mb-1">Achievements</h3>
                            <p class="text-xs text-gray-500 font-semibold">Awards & recognitions</p>
                        </div>
                    </div>
                </div>

                <!-- Quick Info -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-md">
                    <h3 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-5">Student Information</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
                        <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">LRN</p>
                            <p class="text-sm font-black text-gray-800 font-mono">${activeStudent.lrn}</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Student ID</p>
                            <p class="text-sm font-black text-gray-800 font-mono">${activeStudent.student_id_number || 'N/A'}</p>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-4 border border-blue-100">
                            <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mb-2">Section</p>
                            <p class="text-sm font-black text-blue-700">${activeStudent.section || 'N/A'}</p>
                        </div>
                        <div class="bg-purple-50 rounded-xl p-4 border border-purple-100">
                            <p class="text-[10px] font-bold text-purple-600 uppercase tracking-widest mb-2">Grade Level</p>
                            <p class="text-sm font-black text-purple-700">Grade ${activeStudent.grade_level || 'N/A'}</p>
                        </div>
                    </div>
                </div>

                <!-- Footer content follows the dashboard cards. -->
                <!-- Privacy Policy Link -->
                <div class="mt-6 text-center">
                    <a href="../privacy-policy.html" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
                        Privacy Policy
                    </a>
                </div>
            `;
        }

        // Initialize on load
        initDashboard();
    </script>
    <script src="../../assets/js/parent-language.js"></script>
</body>
</html>
