<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.net wss://*.supabase.co wss://*.supabase.net;">
    <title>Attendance History | Parent Portal</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Acme&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../../assets/js/secure-session.js"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/theme-manager.js"></script>
    <script src="../../assets/js/parent-nav.js"></script>
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/style.css?v=20260905-parent-theme">
    <link rel="stylesheet" href="../../assets/css/parent-portal.css?v=20260905-parent-theme">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <style>
        .student-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .student-card.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <h1 class="text-lg font-black text-gray-900 uppercase tracking-tight" style="font-family: 'Acme', sans-serif;">Attendance History</h1>
                <div class="hidden">
                    <button onclick="handleParentLogout(event)" class="flex shrink-0 items-center gap-2 px-3 py-2.5 sm:px-5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-all text-[10px] sm:text-xs font-black uppercase tracking-widest border border-red-100 shadow-sm whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <button onclick="window.location.href='dashboard.html'" class="inline-flex items-center gap-2 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-emerald-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Parent Portal
            </button>
            <button onclick="handleParentLogout(event)" class="inline-flex items-center gap-2 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-red-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
        <!-- Parent Welcome -->
        <div id="parent-welcome" class="mb-6"></div>

        <!-- Student Selector -->
        <div class="mb-6">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Select Student</h2>
            <div id="student-selector" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Student cards will be inserted here -->
            </div>
        </div>

        <!-- Date Filter -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-md mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="flex-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">From Date</label>
                    <input type="date" id="date-from" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-sm font-bold text-gray-700 focus:border-blue-500 focus:outline-none transition-all">
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">To Date</label>
                    <input type="date" id="date-to" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-sm font-bold text-gray-700 focus:border-blue-500 focus:outline-none transition-all">
                </div>
                <div class="flex gap-2 items-end">
                    <button id="filter-btn" class="px-5 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-black text-xs uppercase tracking-widest hover:from-blue-700 hover:to-purple-700 transition-all shadow-lg">
                        Filter
                    </button>
                    <button id="reset-btn" class="px-5 py-3 bg-gray-100 text-gray-700 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-gray-200 transition-all shadow-sm">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Attendance Summary Cards -->
        <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-6">
            <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-5 border border-green-100 shadow-md hover:shadow-lg transition-all">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
                <p class="text-[10px] font-black text-green-700 uppercase tracking-widest mb-1">Total Logs</p>
                <p id="total-logs" class="text-3xl font-black text-green-800">0</p>
            </div>
            <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-5 border border-blue-100 shadow-md hover:shadow-lg transition-all">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>
                <p class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-1">Days Present</p>
                <p id="days-present" class="text-3xl font-black text-blue-800">0</p>
            </div>
            <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 border border-amber-100 shadow-md hover:shadow-lg transition-all">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"></path>
                        </svg>
                    </div>
                </div>
                <p class="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-1">AM Logs</p>
                <p id="am-logs" class="text-3xl font-black text-amber-800">0</p>
            </div>
            <div class="bg-gradient-to-br from-orange-50 to-red-50 rounded-2xl p-5 border border-orange-100 shadow-md hover:shadow-lg transition-all">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                        </svg>
                    </div>
                </div>
                <p class="text-[10px] font-black text-orange-700 uppercase tracking-widest mb-1">PM Logs</p>
                <p id="pm-logs" class="text-3xl font-black text-orange-800">0</p>
            </div>
        </div>

        <!-- Attendance Logs -->
        <div class="parent-portal-attendance-records bg-white rounded-2xl border border-gray-100 shadow-md overflow-hidden">
            <div class="p-5 bg-gradient-to-r from-gray-50 to-blue-50 border-b border-blue-100">
                <h3 class="text-sm font-black text-gray-800 uppercase tracking-widest">Attendance Records</h3>
            </div>
            <div id="logs-container" class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gradient-to-r from-blue-50 to-purple-50">
                        <tr class="text-[10px] font-black text-gray-700 uppercase tracking-widest">
                            <th class="px-5 py-4 text-center border-b border-blue-100">Date</th>
                            <th class="px-5 py-4 text-center border-b border-blue-100">Time</th>
                            <th class="px-5 py-4 text-center border-b border-blue-100">Session</th>
                            <th class="px-5 py-4 text-center border-b border-blue-100">Modality</th>
                            <th class="px-5 py-4 text-center border-b border-blue-100">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="divide-y divide-blue-50">
                        <tr>
                            <td colspan="5" class="px-5 py-12 text-center text-gray-500 text-xs font-bold uppercase tracking-widest">
                                Loading attendance records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Privacy Policy Link -->
        <div class="mt-6 text-center">
            <a href="../privacy-policy.html" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
                Privacy Policy
            </a>
        </div>
    </main>

    <script>
        let students = [];
        let activeStudent = null;
        let attendanceLogs = [];

        async function loadStudentPhotoSecurely(lrn, photoUrl, imgElement, placeholderSvg) {
            if (!imgElement) return;

            const parentSessionToken = secureSession.getItem('parentSessionToken');
            if (!parentSessionToken) {
                imgElement.style.display = 'none';
                return;
            }

            try {
                // Request a signed URL from our edge function
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-photo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({ parentSessionToken, studentLrn: lrn })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to get photo');
                }

                // Use the signed URL
                imgElement.src = result.signedUrl;
                imgElement.style.display = 'block';
            } catch (err) {
                console.error('Error loading photo:', err);
                imgElement.style.display = 'none';
            }
        }

        async function initPage() {
            if (!window.supabaseClient) {
                setTimeout(initPage, 100);
                return;
            }

            students = secureSession.getItem('parentStudents') || [];
            const activeLrn = secureSession.getItem('activeStudentLrn');
            const parentName = secureSession.getItem('parentName');
            
            if (students.length === 0) {
                window.location.href = 'login.html';
                return;
            }

            activeStudent = students.find(s => String(s.lrn) === String(activeLrn)) || students[0];
            
            renderParentWelcome(parentName);
            
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('date-from').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];

            renderStudentSelector();
            await fetchAttendanceLogs();

            document.getElementById('filter-btn').addEventListener('click', fetchAttendanceLogs);
            document.getElementById('reset-btn').addEventListener('click', resetFilters);
        }

        function renderParentWelcome(parentName) {
            const container = document.getElementById('parent-welcome');
            
            container.innerHTML = `
                <div class="welcome-banner rounded-2xl p-5 text-white shadow-md">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-1">Welcome to Parent Portal</p>
                            <h2 class="text-xl font-black mb-1">Hello, ${parentName || 'Parent'}!</h2>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentSelector() {
            const container = document.getElementById('student-selector');
            
            container.innerHTML = students.map(student => {
                const isActive = String(student.lrn) === String(activeStudent.lrn);
                
                return `
                    <div class="student-card bg-white rounded-2xl p-5 border-2 ${isActive ? 'border-blue-500 active' : 'border-gray-100'} cursor-pointer shadow-sm"
                         data-lrn="${student.lrn}"
                         data-student-name="${student.full_name}">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center overflow-hidden shadow-sm">
                                <img class="student-photo w-full h-full object-cover object-top" data-lrn="${student.lrn}" data-photo-url="${student.photo_url || ''}" style="display:none" alt="${student.full_name}">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-black text-gray-900 truncate">${student.full_name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${student.section || 'N/A'}</span>
                                    <span class="text-[10px] font-bold text-gray-400">Grade ${student.grade_level || 'N/A'}</span>
                                </div>
                            </div>
                            ${isActive ? 
                                `<div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center shadow-sm">
                                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            const cards = container.querySelectorAll('.student-card');
            cards.forEach(async (card) => {
                const imgElement = card.querySelector('.student-photo');
                const lrn = imgElement.dataset.lrn;
                const photoUrl = imgElement.dataset.photoUrl || `profiles/${lrn}.webp`;
                await loadStudentPhotoSecurely(lrn, photoUrl, imgElement);
                
                card.addEventListener('click', () => {
                    const lrn = card.getAttribute('data-lrn');
                    if (lrn) selectStudent(lrn);
                });
            });
        }

        function selectStudent(lrn) {
            activeStudent = students.find(s => String(s.lrn) === String(lrn));
            secureSession.setItem('activeStudentLrn', lrn);
            renderStudentSelector();
            fetchAttendanceLogs();
        }

        async function fetchAttendanceLogs() {
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;
            const parentSessionToken = secureSession.getItem('parentSessionToken');

            try {
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({
                        parentSessionToken,
                        studentLrn: activeStudent.lrn,
                        type: 'attendance',
                        dateFrom,
                        dateTo
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error);
                }

                attendanceLogs = result.attendance || [];
                renderSummary();
                renderLogs();

            } catch (err) {
                console.error('Error fetching attendance:', err);
                document.getElementById('logs-tbody').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-5 py-12 text-center text-red-600 text-xs font-bold uppercase tracking-widest">
                            Error loading attendance records
                        </td>
                    </tr>
                `;
            }
        }

        function renderSummary() {
            const totalLogs = attendanceLogs.length;
            const amLogs = attendanceLogs.filter(log => log.session === 'AM').length;
            const pmLogs = attendanceLogs.filter(log => log.session === 'PM').length;
            
            const uniqueDays = new Set();
            attendanceLogs.forEach(log => {
                const date = new Date(log.scanned_at).toDateString();
                uniqueDays.add(date);
            });
            const daysPresent = uniqueDays.size;

            document.getElementById('total-logs').textContent = totalLogs;
            document.getElementById('days-present').textContent = daysPresent;
            document.getElementById('am-logs').textContent = amLogs;
            document.getElementById('pm-logs').textContent = pmLogs;
        }

        function renderLogs() {
            const tbody = document.getElementById('logs-tbody');
            
            if (attendanceLogs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-5 py-12 text-center text-gray-500 text-xs font-bold uppercase tracking-widest">
                            No attendance records found for this period
                        </td>
                    </tr>
                `;
                return;
            }

            const modalityConfig = {
                'face_to_face': { color: 'bg-gradient-to-r from-gray-100 to-blue-50 text-gray-800 border border-gray-200', label: 'Face-to-Face' },
                'online': { color: 'bg-gradient-to-r from-purple-100 to-indigo-50 text-purple-800 border border-purple-200', label: 'Online' },
                'modular': { color: 'bg-gradient-to-r from-yellow-100 to-amber-50 text-yellow-800 border border-yellow-200', label: 'Modular' }
            };

            tbody.innerHTML = attendanceLogs.map(log => {
                const date = new Date(log.scanned_at);
                const dateStr = date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                const timeStr = date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });

                const sessionColors = {
                    'AM': 'bg-gradient-to-r from-blue-100 to-indigo-50 text-blue-800 border border-blue-200',
                    'PM': 'bg-gradient-to-r from-amber-100 to-orange-50 text-amber-800 border border-amber-200',
                    'DEPARTURE': 'bg-gradient-to-r from-orange-100 to-red-50 text-orange-800 border border-orange-200'
                };

                const modality = log.modality || 'face_to_face';
                const modalityInfo = modalityConfig[modality] || modalityConfig['face_to_face'];

                return `
                    <tr class="hover:bg-blue-50 transition-colors">
                        <td class="px-5 py-4 text-center border-b border-blue-50">
                            <span class="text-sm font-black text-gray-900">${dateStr}</span>
                        </td>
                        <td class="px-5 py-4 text-center border-b border-blue-50">
                            <span class="text-sm font-bold text-gray-600 font-mono">${timeStr}</span>
                        </td>
                        <td class="px-5 py-4 text-center border-b border-blue-50">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${sessionColors[log.session] || 'bg-gray-100 text-gray-800 border border-gray-200'}">
                                ${log.session || 'N/A'}
                            </span>
                        </td>
                        <td class="px-5 py-4 text-center border-b border-blue-50">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${modalityInfo.color}">
                                ${modalityInfo.label}
                            </span>
                        </td>
                        <td class="px-5 py-4 text-center border-b border-blue-50">
                            <span class="px-3 py-1 bg-gradient-to-r from-green-100 to-emerald-50 text-green-800 border border-green-200 rounded-full text-[10px] font-black uppercase">
                                Present
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('date-from').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];
            fetchAttendanceLogs();
        }

        initPage();
    </script>
</body>
</html>
