<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.net wss://*.supabase.co wss://*.supabase.net;">
    <title>Attendance History | Parent Portal</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Acme&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../../assets/js/secure-session.js"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/parent-nav.js"></script>
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <style>
        .student-card {
            transition: all 0.2s ease;
        }
        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .student-card.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-lg font-black text-gray-900 uppercase tracking-tight" style="font-family: 'Acme', sans-serif;">Attendance History</h1>
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='dashboard.html'" class="flex items-center gap-2 px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-gray-200 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        Back
                    </button>
                    <button onclick="handleParentLogout(event)" class="flex items-center gap-2 px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-red-100 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Student Selector -->
        <div class="mb-6">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Select Student</h2>
            <div id="student-selector" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Student cards will be inserted here -->
            </div>
        </div>

        <!-- Student Info Banner -->
        <div id="student-banner" class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-6">
            <div class="flex items-center gap-4">
                <div id="student-photo-container" class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden">
                    <svg class="w-8 h-8 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div>
                    <h2 id="student-name" class="text-sm font-black text-gray-900"></h2>
                    <p id="student-details" class="text-xs font-bold text-gray-500 uppercase tracking-widest"></p>
                </div>
            </div>
        </div>

        <!-- Date Filter -->
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="flex-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">From Date</label>
                    <input type="date" id="date-from" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-bold text-gray-700 focus:border-blue-500 focus:outline-none">
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">To Date</label>
                    <input type="date" id="date-to" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-bold text-gray-700 focus:border-blue-500 focus:outline-none">
                </div>
                <div class="flex gap-2 items-end">
                    <button id="filter-btn" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-md">
                        Filter
                    </button>
                    <button id="reset-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-300 transition-all">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Attendance Summary Cards -->
        <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-green-50 rounded-2xl p-4 border border-green-100">
                <p class="text-[10px] font-black text-green-700 uppercase tracking-widest mb-1">Total Logs</p>
                <p id="total-logs" class="text-2xl font-black text-green-800">0</p>
            </div>
            <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100">
                <p class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-1">Days Present</p>
                <p id="days-present" class="text-2xl font-black text-blue-800">0</p>
            </div>
            <div class="bg-amber-50 rounded-2xl p-4 border border-amber-100">
                <p class="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-1">AM Logs</p>
                <p id="am-logs" class="text-2xl font-black text-amber-800">0</p>
            </div>
            <div class="bg-orange-50 rounded-2xl p-4 border border-orange-100">
                <p class="text-[10px] font-black text-orange-700 uppercase tracking-widest mb-1">PM Logs</p>
                <p id="pm-logs" class="text-2xl font-black text-orange-800">0</p>
            </div>
        </div>

        <!-- Attendance Logs -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="p-4 bg-gray-50 border-b border-gray-100">
                <h3 class="text-sm font-black text-gray-700 uppercase tracking-widest">Attendance Records</h3>
            </div>
            <div id="logs-container" class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr class="text-[10px] font-black text-gray-400 uppercase tracking-widest">
                            <th class="px-4 py-3 text-center">Date</th>
                            <th class="px-4 py-3 text-center">Time</th>
                            <th class="px-4 py-3 text-center">Session</th>
                            <th class="px-4 py-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="4" class="px-4 py-8 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">
                                Loading attendance records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Logout Button at Bottom -->
        <div class="mt-8 flex justify-center">
            <button onclick="handleParentLogout(event)" class="flex items-center gap-2 px-6 py-3 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-all text-sm font-black uppercase tracking-widest border border-red-100 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
        
        <!-- Privacy Policy Link -->
        <div class="mt-6 text-center">
            <a href="../privacy-policy.html" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
                Privacy Policy
            </a>
        </div>
    </main>

    <script>
        let students = [];
        let activeStudent = null;
        let attendanceLogs = [];

        async function initPage() {
            if (!window.supabaseClient) {
                setTimeout(initPage, 100);
                return;
            }

            // Check if parent is logged in
            students = secureSession.getItem('parentStudents') || [];
            const activeLrn = secureSession.getItem('activeStudentLrn');
            
            if (students.length === 0) {
                window.location.href = 'login.html';
                return;
            }

            activeStudent = students.find(s => String(s.lrn) === String(activeLrn)) || students[0];
            
            // Set default date range (last 30 days)
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('date-from').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];

            renderStudentSelector();
            renderStudentInfo();
            await fetchAttendanceLogs();

            // Event listeners
            document.getElementById('filter-btn').addEventListener('click', fetchAttendanceLogs);
            document.getElementById('reset-btn').addEventListener('click', resetFilters);
        }

        // Render student selector
        function renderStudentSelector() {
            const container = document.getElementById('student-selector');
            
            container.innerHTML = students.map(student => {
                const isActive = String(student.lrn) === String(activeStudent.lrn);
                
                return `
                    <div class="student-card bg-white rounded-2xl p-5 border-2 ${isActive ? 'border-blue-500 active' : 'border-gray-100'} cursor-pointer shadow-sm"
                         data-lrn="${student.lrn}"
                         data-student-name="${student.full_name}">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden">
                                ${student.photo_url ? 
                                    `<img src="${student.photo_url}" alt="${student.full_name}" class="w-full h-full object-cover" onerror="this.style.display='none'">` :
                                    `<svg class="w-8 h-8 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                                    </svg>`
                                }
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-black text-gray-900 truncate">${student.full_name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${student.section || 'N/A'}</span>
                                    <span class="text-[10px] font-bold text-gray-400">Grade ${student.grade_level || 'N/A'}</span>
                                </div>
                            </div>
                            ${isActive ? 
                                `<div class="w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center">
                                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add click listeners to student cards
            const cards = container.querySelectorAll('.student-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const lrn = card.getAttribute('data-lrn');
                    if (lrn) selectStudent(lrn);
                });
            });
        }

        // Select student
        function selectStudent(lrn) {
            activeStudent = students.find(s => String(s.lrn) === String(lrn));
            secureSession.setItem('activeStudentLrn', lrn);
            renderStudentSelector();
            renderStudentInfo();
            fetchAttendanceLogs();
        }

        function renderStudentInfo() {
            document.getElementById('student-name').textContent = activeStudent.full_name;
            document.getElementById('student-details').textContent = `${activeStudent.section || 'N/A'} • Grade ${activeStudent.grade_level || 'N/A'}`;
            
            // Load photo if available
            if (activeStudent.photo_url) {
                loadStudentPhoto(activeStudent.photo_url);
            }
        }

        async function loadStudentPhoto(photoUrl) {
            const container = document.getElementById('student-photo-container');
            try {
                if (window.supabaseClient) {
                    const { data, error } = await window.supabaseClient.storage.from('student-photos').download(photoUrl);
                    if (!error) {
                        const url = URL.createObjectURL(data);
                        container.innerHTML = `<img src="${url}" alt="${activeStudent.full_name}" class="w-full h-full object-cover">`;
                    }
                }
            } catch (err) {
                console.error('Error loading photo:', err);
            }
        }

        async function fetchAttendanceLogs() {
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            try {
                let query = window.supabaseClient
                    .from('attendance_logs')
                    .select('*')
                    .eq('student_lrn', activeStudent.lrn)
                    .order('scanned_at', { ascending: false });

                if (dateFrom) {
                    const fromDate = new Date(dateFrom);
                    fromDate.setHours(0, 0, 0, 0);
                    query = query.gte('scanned_at', fromDate.toISOString());
                }

                if (dateTo) {
                    const toDate = new Date(dateTo);
                    toDate.setHours(23, 59, 59, 999);
                    query = query.lte('scanned_at', toDate.toISOString());
                }

                const { data, error } = await query;

                if (error) throw error;

                attendanceLogs = data || [];
                renderSummary();
                renderLogs();

            } catch (err) {
                console.error('Error fetching attendance:', err);
                document.getElementById('logs-tbody').innerHTML = `
                    <tr>
                        <td colspan="4" class="px-4 py-8 text-center text-red-500 text-xs font-bold uppercase tracking-widest">
                            Error loading attendance records
                        </td>
                    </tr>
                `;
            }
        }

        function renderSummary() {
            const totalLogs = attendanceLogs.length;
            const amLogs = attendanceLogs.filter(log => log.session === 'AM').length;
            const pmLogs = attendanceLogs.filter(log => log.session === 'PM').length;
            
            // Calculate unique days present
            const uniqueDays = new Set();
            attendanceLogs.forEach(log => {
                const date = new Date(log.scanned_at).toDateString();
                uniqueDays.add(date);
            });
            const daysPresent = uniqueDays.size;

            document.getElementById('total-logs').textContent = totalLogs;
            document.getElementById('days-present').textContent = daysPresent;
            document.getElementById('am-logs').textContent = amLogs;
            document.getElementById('pm-logs').textContent = pmLogs;
        }

        function renderLogs() {
            const tbody = document.getElementById('logs-tbody');
            
            if (attendanceLogs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-4 py-8 text-center text-gray-400 text-xs font-bold uppercase tracking-widest">
                            No attendance records found for this period
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = attendanceLogs.map(log => {
                const date = new Date(log.scanned_at);
                const dateStr = date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                const timeStr = date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });

                const sessionColors = {
                    'AM': 'bg-blue-100 text-blue-800',
                    'PM': 'bg-amber-100 text-amber-800',
                    'DEPARTURE': 'bg-orange-100 text-orange-800'
                };

                return `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-4 py-3 text-center">
                            <span class="text-sm font-black text-gray-900">${dateStr}</span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="text-sm font-bold text-gray-600 font-mono">${timeStr}</span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="px-2 py-1 rounded-full text-[10px] font-black uppercase ${sessionColors[log.session] || 'bg-gray-100 text-gray-800'}">
                                ${log.session || 'N/A'}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-[10px] font-black uppercase">
                                Present
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('date-from').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];
            fetchAttendanceLogs();
        }

        initPage();
    </script>
</body>
</html>
