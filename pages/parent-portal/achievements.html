<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.supabase.net wss://*.supabase.co wss://*.supabase.net;">
    <title>Achievements | Parent Portal</title>
    <link rel="icon" type="image/webp" href="../../assets/images/school-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Acme&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../../assets/js/secure-session.js"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/theme-manager.js"></script>
    <script src="../../assets/js/parent-nav.js"></script>
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/style.css?v=20260905-parent-theme">
    <link rel="stylesheet" href="../../assets/css/parent-portal.css?v=20260905-parent-theme">
    <script src="../../assets/lib/tailwind.min.js"></script>
    <style>
        .student-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .student-card.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .achievement-item {
            transition: all 0.2s ease;
        }
        .achievement-item:hover {
            transform: translateX(4px);
        }
        .welcome-banner {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <h1 class="text-lg font-black text-gray-900 uppercase tracking-tight" style="font-family: 'Acme', sans-serif;">Achievements</h1>
                <div class="hidden">
                    <button onclick="handleParentLogout(event)" class="flex shrink-0 items-center gap-2 px-3 py-2.5 sm:px-5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-all text-[10px] sm:text-xs font-black uppercase tracking-widest border border-red-100 shadow-sm whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <button onclick="window.location.href='dashboard.html'" class="inline-flex items-center gap-2 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-emerald-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Parent Portal
            </button>
            <button onclick="handleParentLogout(event)" class="inline-flex items-center gap-2 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl transition-all text-xs font-black uppercase tracking-widest border border-red-700 shadow-md hover:shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 013 3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
        <!-- Parent Welcome -->
        <div id="parent-welcome" class="mb-6"></div>

        <!-- Student Selector -->
        <div class="mb-6">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Select Student</h2>
            <div id="student-selector" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Student cards will be inserted here -->
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gradient-to-br from-yellow-400 to-yellow-500 rounded-2xl p-5 text-white shadow-md">
                <div id="total-awards" class="text-3xl font-black mb-1">0</div>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-90">Total Awards</p>
            </div>
            <div class="bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl p-5 text-white shadow-md">
                <div id="academic-awards" class="text-3xl font-black mb-1">0</div>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-90">Academic</p>
            </div>
            <div class="bg-gradient-to-br from-green-400 to-emerald-500 rounded-2xl p-5 text-white shadow-md">
                <div id="sports-awards" class="text-3xl font-black mb-1">0</div>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-90">Sports</p>
            </div>
            <div class="bg-gradient-to-br from-purple-400 to-violet-500 rounded-2xl p-5 text-white shadow-md">
                <div id="conduct-awards" class="text-3xl font-black mb-1">0</div>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-90">Conduct</p>
            </div>
        </div>

        <!-- Achievements Timeline -->
        <div class="parent-portal-achievements bg-white rounded-2xl border border-gray-100 shadow-md overflow-hidden">
            <div class="p-5 bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-100">
                <h3 class="text-xs font-black text-gray-700 uppercase tracking-widest">Recent Achievements</h3>
            </div>
            <div id="achievements-container" class="p-6">
                <!-- Achievements will be rendered here -->
            </div>
        </div>

        <!-- Privacy Policy Link -->
        <div class="mt-6 text-center">
            <a href="../privacy-policy.html" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-gray-600 transition-colors">
                Privacy Policy
            </a>
        </div>
    </main>

    <script>
        let students = [];
        let activeStudent = null;

        async function loadStudentPhotoSecurely(lrn, photoUrl, imgElement, placeholderSvg) {
            if (!imgElement) return;

            const parentSessionToken = secureSession.getItem('parentSessionToken');
            if (!parentSessionToken) {
                imgElement.style.display = 'none';
                return;
            }

            try {
                // Request a signed URL from our edge function
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-photo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({ parentSessionToken, studentLrn: lrn })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to get photo');
                }

                // Use the signed URL
                imgElement.src = result.signedUrl;
                imgElement.style.display = 'block';
            } catch (err) {
                console.error('Error loading photo:', err);
                imgElement.style.display = 'none';
            }
        }

        async function initPage() {
            if (!window.supabaseClient) {
                setTimeout(initPage, 100);
                return;
            }

            // Check if parent is logged in
            students = secureSession.getItem('parentStudents') || [];
            const activeLrn = secureSession.getItem('activeStudentLrn');
            const parentName = secureSession.getItem('parentName');
            
            if (students.length === 0) {
                window.location.href = 'login.html';
                return;
            }

            activeStudent = students.find(s => String(s.lrn) === String(activeLrn)) || students[0];
            
            renderParentWelcome(parentName);
            renderStudentSelector();
            await fetchAchievements();
        }

        function renderParentWelcome(parentName) {
            const container = document.getElementById('parent-welcome');
            
            container.innerHTML = `
                <div class="welcome-banner rounded-2xl p-5 text-white shadow-md">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-1">Welcome to Parent Portal</p>
                            <h2 class="text-xl font-black mb-1">Hello, ${parentName || 'Parent'}!</h2>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentSelector() {
            const container = document.getElementById('student-selector');
            
            container.innerHTML = students.map(student => {
                const isActive = String(student.lrn) === String(activeStudent.lrn);
                
                return `
                    <div class="student-card bg-white rounded-2xl p-5 border-2 ${isActive ? 'border-blue-500 active' : 'border-gray-100'} cursor-pointer shadow-sm"
                         data-lrn="${student.lrn}"
                         data-student-name="${student.full_name}">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center overflow-hidden shadow-sm">
                                <img class="student-photo w-full h-full object-cover object-top" data-lrn="${student.lrn}" data-photo-url="${student.photo_url || ''}" style="display:none" alt="${student.full_name}">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-black text-gray-900 truncate">${student.full_name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${student.section || 'N/A'}</span>
                                    <span class="text-[10px] font-bold text-gray-400">Grade ${student.grade_level || 'N/A'}</span>
                                </div>
                            </div>
                            ${isActive ? 
                                `<div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center shadow-sm">
                                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            const cards = container.querySelectorAll('.student-card');
            cards.forEach(async (card) => {
                const imgElement = card.querySelector('.student-photo');
                const lrn = imgElement.dataset.lrn;
                const photoUrl = imgElement.dataset.photoUrl || `profiles/${lrn}.webp`;
                await loadStudentPhotoSecurely(lrn, photoUrl, imgElement);
                
                card.addEventListener('click', () => {
                    const lrn = card.getAttribute('data-lrn');
                    if (lrn) selectStudent(lrn);
                });
            });
        }

        function selectStudent(lrn) {
            activeStudent = students.find(s => String(s.lrn) === String(lrn));
            secureSession.setItem('activeStudentLrn', lrn);
            renderStudentSelector();
            fetchAchievements();
        }

        async function fetchAchievements() {
            const container = document.getElementById('achievements-container');
            const parentSessionToken = secureSession.getItem('parentSessionToken');
            
            try {
                const response = await fetch(`${window.supabaseClient.supabaseUrl}/functions/v1/parent-data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': window.supabaseClient.supabaseKey
                    },
                    body: JSON.stringify({
                        parentSessionToken,
                        studentLrn: activeStudent.lrn,
                        type: 'achievements'
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error);
                }

                if (!result.achievements || result.achievements.length === 0) {
                    renderSampleAchievements();
                } else {
                    renderAchievements(result.achievements);
                    updateAchievementStats(result.achievements);
                }
            } catch (err) {
                console.error('Error fetching achievements:', err);
                renderSampleAchievements();
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown date';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getAchievementStyles(type) {
            switch(type?.toLowerCase()) {
                case 'academic':
                    return {
                        color: 'border-amber-500',
                        badge: 'bg-gradient-to-r from-amber-100 to-yellow-100 text-amber-800 border border-amber-200',
                        iconBg: 'bg-gradient-to-br from-amber-100 to-yellow-100',
                        iconColor: 'text-amber-600'
                    };
                case 'sports':
                    return {
                        color: 'border-green-500',
                        badge: 'bg-gradient-to-r from-green-100 to-emerald-100 text-green-800 border border-green-200',
                        iconBg: 'bg-gradient-to-br from-green-100 to-emerald-100',
                        iconColor: 'text-green-600'
                    };
                case 'conduct':
                    return {
                        color: 'border-purple-500',
                        badge: 'bg-gradient-to-r from-purple-100 to-violet-100 text-purple-800 border border-purple-200',
                        iconBg: 'bg-gradient-to-br from-purple-100 to-violet-100',
                        iconColor: 'text-purple-600'
                    };
                default:
                    return {
                        color: 'border-blue-500',
                        badge: 'bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-800 border border-blue-200',
                        iconBg: 'bg-gradient-to-br from-blue-100 to-indigo-100',
                        iconColor: 'text-blue-600'
                    };
            }
        }

        function renderAchievements(achievements) {
            const container = document.getElementById('achievements-container');
            
            container.innerHTML = achievements.map(achievement => {
                const styles = getAchievementStyles(achievement.type);
                return `
                    <div class="achievement-item border-l-4 ${styles.color} pl-5 py-5 mb-4 bg-gradient-to-r from-white to-gray-50 rounded-r-2xl border border-l-0 border-gray-100 shadow-sm">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-3 py-1.5 ${styles.badge} rounded-full text-[10px] font-black uppercase">${achievement.type || 'Academic'}</span>
                                    <span class="text-[10px] text-gray-500 font-semibold uppercase tracking-widest">${formatDate(achievement.awarded_at)}</span>
                                </div>
                                <h4 class="text-sm font-black text-gray-900 mb-1">${achievement.title}</h4>
                                <p class="text-xs text-gray-600 font-semibold">${achievement.description || ''}</p>
                            </div>
                            <div class="w-14 h-14 ${styles.iconBg} rounded-full flex items-center justify-center ml-5 flex-shrink-0 shadow-sm">
                                <svg class="w-7 h-7 ${styles.iconColor}" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8 2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateAchievementStats(achievements) {
            document.getElementById('total-awards').textContent = achievements.length;
            document.getElementById('academic-awards').textContent = achievements.filter(a => a.type === 'Academic').length;
            document.getElementById('sports-awards').textContent = achievements.filter(a => a.type === 'Sports').length;
            document.getElementById('conduct-awards').textContent = achievements.filter(a => a.type === 'Conduct').length;
        }

        function renderSampleAchievements() {
            const container = document.getElementById('achievements-container');
            
            updateAchievementStats([]);
            
            container.innerHTML = `
                <div class="text-center py-10">
                    <div class="w-24 h-24 bg-gradient-to-br from-yellow-100 to-amber-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-md">
                        <svg class="w-12 h-12 text-yellow-600" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8 2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                        </svg>
                    </div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">No Achievements Yet</h3>
                    <p class="text-[10px] text-gray-600 font-semibold">Achievements will appear here when awarded</p>
                </div>
            `;
        }

        initPage();
    </script>
</body>
</html>
